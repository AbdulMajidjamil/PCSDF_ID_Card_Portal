<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCSDF ID Verification</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<style>body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(680px,90%);padding:32px;border:1px solid #30363d;border-radius:18px;background:#161b22}h1{margin-top:0}.muted{color:#9da7b3}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:#222}.ok{background:#123b25;color:#9bf0b7}.bad{background:#4a1717;color:#ffb1a8}.row{padding:10px 0;border-bottom:1px solid #30363d}code{color:#ffd58a}</style></head>
<body><main class="box"><h1>PCSDF ID Verification</h1><p class="muted">Verification of a PCSDF identification record.</p><div id="result">Checking record…</div></main>
<script>
const id=new URLSearchParams(location.search).get('id'); const result=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async()=>{
 if(!id){result.innerHTML='<p class="muted">No ID number supplied. Use <code>?id=PCSDF-2026-051</code>.</p>';return;}
 if(!window.supabaseClient){result.innerHTML='<p class="bad status">Verification database is not configured.</p>';return;}
 const {data,error}=await window.supabaseClient.rpc('get_pcsdf_verification',{p_id:id});
 if(error){result.innerHTML='<p class="bad status">Verification service error.</p>';return;}
 const row=Array.isArray(data)?data[0]:data;
 if(!row){result.innerHTML='<p class="bad status">Record not found</p><p class="muted">ID: '+esc(id)+'</p>';return;}
 result.innerHTML='<p><span class="status ok">'+esc(String(row.status||'active').toUpperCase())+'</span></p>'+
 '<div class="row"><strong>ID Number</strong><br>'+esc(row.id_number)+'</div>'+
 '<div class="row"><strong>Name</strong><br>'+esc(row.full_name)+'</div>'+
 '<div class="row"><strong>Role</strong><br>'+esc(row.role)+'</div>'+
 '<div class="row"><strong>Department / Program</strong><br>Intern - '+esc(row.department)+'</div>'+
 '<div class="row"><strong>Validity</strong><br>'+esc(row.issue_date||'—')+' to '+esc(row.expiry_date||'—')+'</div>';
})();
</script></body></html>
